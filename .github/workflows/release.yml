name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "22"
          cache: gradle

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: latest

      - name: Derive release version from tag
        run: |
          RAW_TAG="${GITHUB_REF_NAME}"
          RELEASE_VERSION="${RAW_TAG#v}"
          echo "RELEASE_VERSION=${RELEASE_VERSION}" >> "$GITHUB_ENV"

      - name: Build JAR and all native targets
        run: ./gradlew build buildNativeAll assembleNativeDist -PreleaseVersion="${RELEASE_VERSION}" -PhostNativeTarget=linux-x86_64

      - name: Publish to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publish -PreleaseVersion="${RELEASE_VERSION}" -PgithubRepository="${{ github.repository }}" -PhostNativeTarget=linux-x86_64

      - name: Upload JAR and native artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/*.jar
            build/native/macos-aarch64/*
            build/native/linux-x86_64/*
            build/native/windows-x86_64/*
